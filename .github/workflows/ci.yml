name: ci
on:
  push:
    branches: [main]
    tags: ['v*']  # the action is used by tag, so a tag is checked too
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "17", "18"]
        python: ["3.12"]
        include:
          - postgres: "18"
            python: "3.10"
          - postgres: "18"
            python: "3.15"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGMC_TEST_DSN: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - name: Django 6 needs Postgres 15 or newer; test Postgres 14 with Django 5.2 LTS
        if: matrix.postgres == '14'
        run: pip install 'django>=5.2,<6'
      - run: pytest -q
      - name: the example migration is caught
        run: |
          psql "$PGMC_TEST_DSN" -c "create database demo"
          psql "postgresql://postgres:ci@localhost:5432/demo" -f examples/schema.sql
          set +e
          pg-migration-check examples/0002_unsafe.sql --dsn postgresql://postgres:ci@localhost:5432/demo; code=$?
          set -e
          test $code -eq 1
      - name: the safe version passes (on a fresh copy, as both start from the same schema)
        run: |
          # On Postgres 18 the unsafe run's SET NOT NULL leaves a constraint named orders_email_not_null behind
          psql "$PGMC_TEST_DSN" -c "create database demo_safe"
          psql "postgresql://postgres:ci@localhost:5432/demo_safe" -f examples/schema.sql
          pg-migration-check examples/0003_safe.sql --dsn postgresql://postgres:ci@localhost:5432/demo_safe
      - name: --rollback leaves a 100k row table exactly as it was
        run: python bench/rollback.py --rows 100000 --dsn "$PGMC_TEST_DSN"
      - name: a fresh copy of the example schema for the action
        run: |
          psql "$PGMC_TEST_DSN" -c "create database action_demo"
          psql "postgresql://postgres:ci@localhost:5432/action_demo" -f examples/schema.sql
      - name: the action fails the unsafe example (this step is expected to fail)
        id: unsafe
        continue-on-error: true
        uses: ./
        with:
          files: examples/0002_unsafe.sql
          dsn: postgresql://postgres:ci@localhost:5432/action_demo
          rollback: "true"
      - name: it did fail
        run: test "${{ steps.unsafe.outcome }}" = failure
      - name: the action passes the safe example, globs expanded
        uses: ./
        with:
          files: examples/0003_*.sql
          dsn: postgresql://postgres:ci@localhost:5432/action_demo
          rollback: "true"
